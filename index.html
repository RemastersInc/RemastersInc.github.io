<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Benchmark Dashboard</title>
<style>
:root { --bg: #f5f6f8; --fg: #1b2130; --muted: #5b6474; --card: #ffffff; --line: #dde2ea; --accent: #2f6fde; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #0e1117; --fg: #e5e8ee; --muted: #96a0b1; --card: #161a22; --line: #283040; --accent: #6ea1ff; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
       background: var(--bg); color: var(--fg); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
main { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 32px; }
h1 { margin: 0 0 10px; font-size: 1.6rem; letter-spacing: -0.01em; display: flex; align-items: center; gap: 10px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
p { margin: 0 0 10px; color: var(--muted); }
time { color: var(--fg); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<main>
<h1><span class="dot" aria-hidden="true"></span>Benchmark Dashboard</h1>
<p>Hello, world. This page is a publishing test; the figures will appear here.</p>
<p>Generated <time datetime="2026-11-05T20:35:16Z">2026-11-05 20:35 UTC</time></p>
</main>
</body>
</html>
